<script>
const Q=[{"n": 1, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "Um analista deseja determinar o saldo das origens de recursos de uma entidade, que são atribuídos ao capital próprio. O analista deve determinar o saldo", "alts": {"A": "do ativo.", "B": "das receitas.", "C": "do passivo.", "D": "das despesas.", "E": "do patrimônio líquido."}, "g": "E", "exp": "Patrimônio líquido representa o capital próprio: é a parcela residual dos ativos depois de deduzidos os passivos. Ativo reúne recursos; passivo, obrigações; receitas e despesas são elementos de desempenho, não o saldo do capital próprio."}, {"n": 2, "banca": "FGV - Ana Leg (ALEGO)/ALEGO/Analista de Controle Interno/Contabilidade/2026", "q": "Em 31/12/2025, uma entidade apresentava os seguintes saldos: Direitos de curto prazo: R$ 50.000; Obrigações de curto prazo: R$ 70.000; Obrigações de longo prazo: R$ 120.000; Direitos de longo prazo: R$ 150.000; Bens duráveis: R$ 210.000. Em 31/12/2025, o patrimônio líquido da entidade era de", "alts": {"A": "R$ 10.000.", "B": "R$ 20.000.", "C": "R$ 200.000.", "D": "R$ 220.000.", "E": "R$ 410.000."}, "g": "D", "exp": "Ativo = 50.000 + 150.000 + 210.000 = 410.000. Passivo = 70.000 + 120.000 = 190.000. Pela equação Ativo = Passivo + PL, PL = 410.000 − 190.000 = 220.000."}, {"n": 3, "banca": "FGV - Ana Leg (ALEGO)/ALEGO/Contador/2026", "q": "Ao observar as contas de um Balanço Patrimonial, em 31/12/2025, um analista constatou que a entidade não apresentava obrigações com terceiros de curto prazo, apenas de longo prazo. Ainda, não havia elementos patrimoniais negativos. Em relação aos elementos patrimoniais e suas implicações, pode- se afirmar que", "alts": {"A": "o passivo é igual a zero.", "B": "o capital circulante líquido é negativo.", "C": "o ativo é maior do que o patrimônio líquido.", "D": "o ativo não circulante é maior do que o circulante.", "E": "o ativo e o patrimônio líquido apresentam o mesmo valor."}, "g": "C", "exp": "Se existem obrigações com terceiros, ainda que somente de longo prazo, o passivo não é zero. Sem elementos patrimoniais negativos, Ativo = Passivo + PL; como o passivo é positivo, o ativo é maior que o patrimônio líquido. Não há dados para concluir a relação entre ativo circulante e não circulante."}, {"n": 4, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "A contabilidade pode se dividir em diferentes campos de aplicação. A contabilidade gerencial é voltada a(o)", "alts": {"A": "Governo.", "B": "pesquisadores.", "C": "usuários internos.", "D": "usuários externos.", "E": "órgãos reguladores."}, "g": "C", "exp": "A contabilidade gerencial é produzida para apoiar planejamento, controle e decisão dentro da entidade. Portanto, seus destinatários centrais são os usuários internos. Governo, pesquisadores, usuários externos e reguladores não são o foco desse campo."}, {"n": 5, "banca": "FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026", "q": "Uma empresa alimentícia realiza as suas entregas interestaduais por meio de um caminhão de carga. Em 10/12/2024, a empresa foi notificada porque o caminhão transportava mais do que o limite local permitido. O prazo para pagamento da multa era de 30 dias e não havia possibilidade de recorrer. Ao realizar a sua Demonstração do Resultado anual, referente a 2024, a empresa decidiu esperar até a finalização do prazo para pagamento da multa para reconhecer a despesa. Ao analisar o fato, um perito constatou que não foi atendida a característica qualitativa da", "alts": {"A": "neutralidade.", "B": "tempestividade.", "C": "continuidade.", "D": "materialidade.", "E": "compreensibilidade."}, "g": "B", "exp": "A multa decorreu de fato ocorrido em 2024, sem possibilidade de recurso. Adiar o reconhecimento até o fim do prazo de pagamento torna a informação menos disponível no momento oportuno. A característica afetada é a tempestividade. Neutralidade trata de ausência de viés; materialidade depende da capacidade de influenciar decisões; compreensibilidade trata da apresentação clara."}, {"n": 6, "banca": "FGV - Ana Leg (ALEGO)/ALEGO/Contador/2026", "q": "Uma entidade afirma que os seus relatórios financeiros para fins gerais seguem o objetivo divulgado na Estrutura Conceitual para Relatório Financeiro. Isso significa que os relatórios buscam", "alts": {"A": "maximizar o resultado financeiro obtido pela entidade que reporta, em cumprimento às normas contábeis.", "B": "seguir as normas contábeis que considera mais apropriadas, para que a informação financeira seja mais prudente.", "C": "publicar seus dados financeiros com precisão suficiente para que estes não recebam ressalva de auditores independentes.", "D": "representar fonte de informação financeira ao maior número de usuários possível, em relação aos investimentos realizados na entidade que reporta.", "E": "fornecer informações financeiras sobre a entidade que reporta que sejam úteis a seus usuários primários na tomada de decisões referente à oferta de recursos à entidade."}, "g": "E", "exp": "O objetivo dos relatórios financeiros para fins gerais é fornecer informação financeira útil aos usuários primários para decisões sobre fornecer recursos à entidade. Não é maximizar resultado, escolher normas livremente, evitar ressalvas de auditoria nem atender indistintamente ao maior número possível de pessoas."}, {"n": 7, "banca": "FGV - Ana Leg (ALERO)/ALERO/Contabilidade/2026", "q": "De acordo com o Pronunciamento Técnico CPC 00 (R2)- Estrutura Conceitual para Relatório Financeiro, o objetivo do relatório financeiro para fins gerais é fornecer informações financeiras sobre a entidade que reporta que sejam úteis para os seus principais usuários na tomada de decisões referente à oferta de recursos à entidade. O público em geral também pode considerar relatórios financeiros para fins gerais úteis. No entanto, esses relatórios serão direcionados a eles quando são", "alts": {"A": "credores e reguladores.", "B": "investidores e credores.", "C": "empregados e administradores.", "D": "administradores e investidores.", "E": "reguladores e entidades governamentais."}, "g": "B", "exp": "Os principais usuários são investidores existentes e potenciais, credores por empréstimos e outros credores. Entre as opções, 'investidores e credores' é a combinação compatível. Administradores, reguladores e entidades governamentais podem usar os relatórios, mas não formam o grupo de usuários primários indicado na questão."}, {"n": 8, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "De acordo com o Pronunciamento Técnico CPC 00 (R2)- Estrutura Conceitual para Relatório Financeiro, muitos investidores, credores por empréstimos e outros credores, existentes e potenciais, são os principais usuários aos quais se destinam relatórios financeiros para fins gerais. Isso significa que esses usuários", "alts": {"A": "têm as mesmas necessidades e desejos de informação.", "B": "representam a única fonte de financiamento da entidade.", "C": "podem exigir que a entidade que reporta forneça informações diretamente a eles.", "D": "devem se basear nestes relatórios para muitas das informações financeiras de que necessitam.", "E": "recebem informação sobre o montante que representa o valor da entidade por meio destes relatórios."}, "g": "D", "exp": "Os usuários primários muitas vezes não conseguem exigir informação diretamente e, por isso, precisam se apoiar nos relatórios financeiros para muitas de suas necessidades. Eles não têm necessidades idênticas, não são a única fonte de financiamento e os relatórios não fornecem, por si, o valor exato da entidade."}, {"n": 9, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Um passivo representa uma obrigação da entidade de transferir um recurso econômico. Essa obrigação é resultado de eventos", "alts": {"A": "passados.", "B": "presentes.", "C": "futuros.", "D": "passados e presentes.", "E": "presentes e futuros."}, "g": "A", "exp": "Passivo é uma obrigação presente de transferir recurso econômico como resultado de eventos passados. O evento que origina a obrigação já ocorreu; eventos futuros, isoladamente, não satisfazem essa definição."}, {"n": 10, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "De acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, ativo é um recurso econômico presente, controlado pela entidade como resultado de eventos passados. Um recurso econômico representa", "alts": {"A": "um bem ou um direito que pertence à entidade.", "B": "uma obrigação de transferir benefícios econômicos.", "C": "um direito que tem o potencial de produzir benefícios econômicos.", "D": "uma obrigação que resulta em aumento no patrimônio líquido, exceto quando referente a contribuições de detentores de direitos sobre o patrimônio."}, "g": "C", "exp": "Recurso econômico é um direito que tem potencial de produzir benefícios econômicos. A alternativa A restringe indevidamente o conceito a 'bem ou direito que pertence'; B descreve obrigação; D também fala em obrigação e efeito no PL, não em recurso econômico."}, {"n": 11, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "Em 2024, uma empresa de varejo estimava inadimplência de 2% sobre o saldo de Clientes. Em 2025, buscando aumentar as vendas, a empresa reduziu as suas exigências para concessão de crédito aos clientes. Assim, uma análise criteriosa indicava que a inadimplência seria muito próxima de 5% nesse ano. No entanto, uma vez que os administradores da empresa são avaliados de acordo com o resultado operacional, eles escolheram continuar utilizando a estimativa anterior, de 2%. Ao avaliar se a informação contábil pode ser considerada representação fidedigna, é correto concluir que", "alts": {"A": "pode ser, uma vez que é comparável.", "B": "pode ser, uma vez que é tempestiva.", "C": "não pode ser, uma vez que não é neutra.", "D": "não pode ser, uma vez que não é verificável."}, "g": "C", "exp": "A administração manteve 2% apesar de evidência de inadimplência próxima de 5% para preservar o resultado pelo qual é avaliada. Isso introduz viés e compromete a neutralidade, componente da representação fidedigna. Comparabilidade ou tempestividade não corrigem esse viés; o problema narrado não é falta de verificabilidade."}, {"n": 12, "banca": "FGV - Ana (TJ SC)/TJ SC/Contábil-Econômico/2026", "q": "Uma entidade vende matéria-prima a terceiros. Em 01/03/2026, um cliente mostrou interesse em realizar uma grande encomenda com pagamento previsto para 120 dias. Em 31/03/2026, as demonstrações contábeis do cliente foram publicadas. Após analisar o Balanço Patrimonial, a entidade decidiu não aceitar a encomenda. Com base no Pronunciamento Técnico CPC 00 (R2) – Estrutura Conceitual para Relatório Financeiro, a informação recebida", "alts": {"A": "é relevante, uma vez que teve valor confirmatório da situação.", "B": "é relevante, uma vez que fez diferença na decisão tomada pela entidade.", "C": "não é relevante, uma vez que não teve valor preditivo.", "D": "não é relevante, uma vez que a entidade não terá um relacionamento com o cliente.", "E": "não é relevante, uma vez que a entidade poderia ter conhecimento sobre a situação a partir de outras fontes."}, "g": "B", "exp": "Informação é relevante quando é capaz de fazer diferença em uma decisão. O balanço publicado levou a entidade a rejeitar a encomenda, logo a informação efetivamente influenciou a decisão. Não é necessário que haja relacionamento posterior nem que a informação seja exclusiva daquela fonte."}, {"n": 13, "banca": "FGV - Cont (NAV Brasil)/NAV Brasil/2026", "q": "A Cia X tem como único fornecedor a Cia Y. A Cia X e a Cia Y elaboram as suas demonstrações contábeis com base na premissa de continuidade operacional. De acordo com a NBC TG Estrutura Conceitual - Estrutura Conceitual para Relatório Financeiro, com base na continuidade operacional, é possível presumir que as entidades não têm a intenção e nem a necessidade de", "alts": {"A": "entrar em liquidação.", "B": "buscar novos parceiros.", "C": "aumentar os seus preços.", "D": "otimizar o número de filiais.", "E": "modificar as suas políticas contábeis."}, "g": "A", "exp": "Na continuidade operacional presume-se que a entidade continuará em operação no futuro previsível, sem intenção nem necessidade de entrar em liquidação ou deixar de negociar. Buscar parceiros, alterar preços, otimizar filiais ou modificar políticas não define a premissa."}, {"n": 14, "banca": "FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026", "q": "Em 01/01/2025, uma sociedade empresária investiu R$90.000 em uma aplicação financeira de longo prazo. Os juros são reconhecidos mensalmente e adicionados ao principal, para resgate no final do período da aplicação. Ao analisar as movimentações nas demonstrações contábeis, o perito contábil constatou que, mensalmente, em 2025, houve", "alts": {"A": "reconhecimento de receita financeira e aumento no ativo circulante.", "B": "reconhecimento de receita financeira e aumento no ativo realizável a longo prazo.", "C": "reconhecimento de receita financeira e aumento em investimentos.", "D": "reconhecimento de receita operacional e aumento no ativo realizável a longo prazo.", "E": "reconhecimento de receita operacional e aumento em investimentos."}, "g": "B", "exp": "A aplicação é de longo prazo. Os juros mensais aumentam o valor do direito classificado no realizável a longo prazo e são reconhecidos como receita financeira. Não se trata de receita operacional nem da conta 'Investimentos' no sentido apresentado pelas alternativas."}, {"n": 15, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "Em dezembro de 2025, uma empresa de perícia contábil prestou serviços a terceiros, tendo recebido, à vista, R$200.000. Em relação à equação fundamental do patrimônio, houve variação nos seguintes grupos", "alts": {"A": "ativo, apenas.", "B": "patrimônio líquido, apenas.", "C": "ativo e passivo.", "D": "ativo e patrimônio líquido.e)  passivo e patrimônio líquido."}, "g": "D", "exp": "Serviço prestado e recebido à vista: entra caixa, aumentando o ativo, e reconhece-se receita, que aumenta o resultado e, consequentemente, o patrimônio líquido. Não surge passivo pela operação descrita."}, {"n": 16, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "Em 01/01/2025, uma sociedade empresária pagou, antecipadamente, o seguro de dois anos de seus veículos. O valor pago foi de R$36.000 e o seguro é apropriado mensalmente de modo linear. No momento do pagamento, o Balanço Patrimonial da sociedade empresária variou do seguinte modo:", "alts": {"A": "o ativo circulante e o patrimônio líquido diminuíram em R$36.000.", "B": "o passivo circulante aumentou e o patrimônio líquido diminuiu em R$18.000.", "C": "o ativo circulante diminuiu e o realizável a longo prazo aumentou em R$18.000.", "D": "o ativo realizável a longo prazo e o passivo circulante aumentaram em R$36.000.", "E": "o ativo circulante diminuiu e o realizável a longo prazo aumentou em R$36.000."}, "g": "C", "exp": "O seguro cobre 24 meses. No pagamento, 12 meses correspondem ao curto prazo (R$18.000) e 12 meses ao longo prazo (R$18.000). O caixa cai R$36.000; simultaneamente surgem direitos de seguro a apropriar, com R$18.000 no circulante e R$18.000 no realizável a longo prazo. Assim, comparando grupos, o AC diminui R$18.000 e o RLP aumenta R$18.000."}, {"n": 17, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Em janeiro de 2026, uma entidade reconheceu contabilmente um débito de R$ 30.000, decorrente de uma compra efetuada de terceiros, na conta de estoques. De acordo com o método das partidas dobradas, o lançamento pode ter como contrapartida um(a)", "alts": {"A": "aumento no resultado.", "B": "aumento em conta do ativo.", "C": "aumento em conta do passivo.", "D": "diminuição em conta do passivo.", "E": "diminuição em conta do patrimônio líquido."}, "g": "C", "exp": "Débito em Estoques aumenta um ativo. Em uma compra de terceiros a prazo, a contrapartida típica é crédito em Fornecedores, aumentando o passivo. As demais alternativas não representam a contrapartida coerente com a compra descrita."}, {"n": 18, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "A empresa “A” realizou a venda de 350.000 quadros de madeira (30x40 cm), totalizando R$ 250.000,00 em mercadorias vendidas. Sabe-se que o controle das mercadorias foi imediatamente transferido aos clientes. O recebimento foi distribuído da seguinte forma: 50% em Caixa, 25% em Banco, e 25% a prazo, com vencimento em 30 dias. Com base nesses dados, assinale a opção correta quanto à contabilização dessas operações.", "alts": {"A": "Débito: Caixa R$ 125.000,00 Débito: Banco Conta Movimento R$ 62.500,00 Débito: Duplicatas a Receber R$ 62.500,00 Crédito: Receita de Vendas R$ 250.000,00", "B": "Débito: Caixa R$ 125.000,00 Débito: Duplicatas a Receber R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00", "C": "Débito: Caixa R$ 250.000,00 Crédito: Receita de Vendas R$ 250.000,00", "D": "Débito: Caixa R$ 125.000,00 Débito: Banco R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00"}, "g": "A", "exp": "Venda total de R$250.000: 50% em Caixa = R$125.000; 25% em Banco = R$62.500; 25% a prazo = R$62.500. Debitam-se esses ativos e credita-se Receita de Vendas em R$250.000. Só a alternativa A distribui corretamente os três recebimentos."}, {"n": 19, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "Ao preparar o encerramento do exercício, o setor de Contabilidade da companhia “B” S.A. listou as seguintes contas e seus respectivos saldos: 1. Adiantamento a fornecedor: R$ 12.000,00; 2. Adiantamento de clientes: R$ 8.000,00; 3. Encargos financeiros a transcorrer (sobre empréstimos bancários obtidos): R$ 3.500,00; 4. Ações de emissão própria em tesouraria: R$ 5.000,00; 5. Juros sobre o capital próprio a pagar: R$ 4.500,00; 6. Perdas estimadas com créditos de liquidação duvidosa: R$ 2.000,00. Assinale a opção que indica o somatório correto, em valores absolutos, das contas de natureza devedora.", "alts": {"A": "R$ 20.500,00.", "B": "R$ 15.500,00.", "C": "R$ 12.000,00.", "D": "R$ 20.000,00."}, "g": "A", "exp": "Contas de natureza devedora consideradas no gabarito: Adiantamento a fornecedor R$12.000; Encargos financeiros a transcorrer R$3.500; Ações em tesouraria R$5.000. Soma absoluta = R$20.500. Adiantamento de clientes e JCP a pagar têm natureza credora; perdas estimadas com créditos são conta redutora do ativo, de natureza credora."}, {"n": 20, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Uma entidade presta serviços a terceiros. Em janeiro de 2026, a entidade reconheceu receita de R$ 400.000. O valor deverá ser recebido em março. A entidade estima inadimplência de 5%. O fato trouxe o seguinte aumento nos elementos patrimoniais da entidade", "alts": {"A": "R$ 380.000 no ativo e no patrimônio líquido.", "B": "R$ 380.000 no passivo e no patrimônio líquido.", "C": "R$ 400.000 no ativo e no patrimônio líquido.", "D": "R$ 400.000 no passivo e no patrimônio líquido.", "E": "R$ 400.000 no ativo, R$ 20.000 no passivo e R$ 380.000 no patrimônio líquido."}, "g": "A", "exp": "A receita a prazo gera direito de R$400.000, mas a perda estimada de 5% é R$20.000. Efeito líquido no ativo = R$380.000; o efeito líquido no resultado e no PL também é R$380.000. A perda estimada não é apresentada como passivo."}, {"n": 21, "banca": "FGV - ADTND (AMAZUL)/AMAZUL/Auditor/2026", "q": "O regime de caixa é um método simplificado de apuração contábil adotado por algumas entidades, que registra receitas e despesas conforme a movimentação financeira efetiva. Esse instrumento é especialmente utilizado por microempresas e organizações sem fins lucrativos, dada sua simplicidade operacional. Considerando as características do regime de caixa, assinale a opção que o descreve corretamente.", "alts": {"A": "Reconhece receitas no momento da emissão do documento fiscal e despesas quando são incorridas.", "B": "Registra receitas e despesas no período a que pertencem, ainda que não haja movimentação financeira.", "C": "Reconhece as receitas somente quando recebidas e as despesas apenas quando pagas.", "D": "Registra receitas com base no valor de venda contratado e despesas conforme o consumo dos insumos.", "E": "Calcula o lucro com base em compromissos futuros assumidos pela entidade."}, "g": "C", "exp": "No regime de caixa, receitas são reconhecidas quando recebidas e despesas quando pagas. As alternativas que vinculam o reconhecimento ao período de ocorrência ou ao fato gerador descrevem lógica de competência, não de caixa."}, {"n": 22, "banca": "FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026", "q": "Uma sociedade empresária paga o salário de seus empregados no décimo dia útil do mês seguinte ao trabalhado e reconhece a despesa correspondente de acordo com o regime de competência. Ao verificar os lançamentos contábeis realizados em relação à despesa de salários, um perito contábil concluiu que", "alts": {"A": "o reconhecimento da despesa é feito após a saída de caixa.", "B": "o reconhecimento da despesa é feito antes da saída de caixa.", "C": "o reconhecimento da despesa é feito de modo simultâneo à saída de caixa.", "D": "o reconhecimento da despesa é feito de modo simultâneo ao reconhecimento do ativo correspondente.", "E": "o reconhecimento da despesa é feito após o reconhecimento do ativo correspondente."}, "g": "B", "exp": "Pelo regime de competência, o salário é despesa do mês trabalhado. Como o pagamento ocorre no décimo dia útil do mês seguinte, a despesa é reconhecida antes da saída de caixa. As demais opções invertem ou tornam simultâneos momentos que a questão separa."}, {"n": 23, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "As Cias A, B e C apresentam diferentes políticas de pagamento de salários mensais a seus empregados. Deste modo, o salário de dezembro de 2025 foi pago do seguinte modo: Cia A: no dia 31/12/2025. Cia B: no dia 10/01/2026. Cia C: no dia 01/01/2026. Em relação ao reconhecimento mensal da despesa de salário, pelo Regime de Competência, e de seu pagamento, pelo Regime de Caixa, é correto afirmar que", "alts": {"A": "na Cia A, o reconhecimento pelo Regime de Competência acontece antes.", "B": "Na Cia B, o reconhecimento pelo Regime de Competência acontece depois.", "C": "Na Cia C, o reconhecimento pelo Regime de Competência e de Caixa acontecem de modo simultâneo.", "D": "Nas Cias A, B e C, o reconhecimento pelo Regime de Competência e de Caixa acontecem em momentos distintos.", "E": "Nas Cias B e C, o reconhecimento pelo Regime de Competência acontecem antes."}, "g": "E", "exp": "O salário de dezembro pertence a dezembro por competência. Na Cia A, pagamento em 31/12 coincide com o reconhecimento; nas Cias B e C, o pagamento ocorre em janeiro, depois do reconhecimento por competência. Portanto, nas B e C a competência acontece antes do caixa."}, {"n": 24, "banca": "FGV - TDTND/AMAZUL/Técnico em Contabilidade/2026", "q": "Em dezembro de 2025, uma loja reconheceu receita de vendas de R$900.000. Do valor, 30% foi recebido à vista. O restante dos clientes comprou com cartão de crédito. O recebimento será feito em três parcelas de igual valor, em janeiro, fevereiro e março de 2026. De acordo com o Regime de Competência, a loja reconheceu a seguinte receita relacionada às vendas", "alts": {"A": "zero em março.", "B": "R$210.000 em fevereiro.", "C": "R$270.000 em dezembro.", "D": "R$630.000 em janeiro.", "E": "R$900.000 em abril."}, "g": "A", "exp": "Toda a receita de R$900.000 é reconhecida em dezembro, quando ocorreu a venda, independentemente do cronograma de recebimento. Assim, não há receita dessas vendas a reconhecer em março: zero. R$270.000 é apenas a parcela recebida à vista; R$630.000 é a parcela a receber, não receita de janeiro."}, {"n": 25, "banca": "FGV - Ana Leg (ALERO)/ALERO/Contabilidade/2026", "q": "Em 01/01/2025, uma sociedade empresária assinou um contrato para aluguel de um imóvel por 6 meses, a partir de janeiro. O valor mensal do aluguel era de R$5.000, que deveriam ser pagos no dia 05 do mês seguinte ao utilizado. Por já ser cliente do locador, a sociedade empresária recebeu um desconto de 10% nos dois primeiros meses de uso do imóvel. Assinale a opção que indica a despesa de aluguel da sociedade empresária em janeiro de 2025, de acordo com o Regime de Competência", "alts": {"A": "zero.", "B": "R$4.500.", "C": "R$5.000.", "D": "R$29.000.", "E": "R$30.000."}, "g": "B", "exp": "O aluguel mensal é R$5.000, com desconto de 10% nos dois primeiros meses. Janeiro custa R$4.500. Pelo regime de competência, essa despesa pertence a janeiro, embora seja paga em fevereiro."}, {"n": 26, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Em 30/11/2025, uma entidade anunciou que pagaria uma bonificação de R$ 30.000 a seus empregados, em função das boas avaliações recebidas em novembro, pelo bom atendimento a clientes no mês. A bonificação foi paga integralmente em janeiro de 2026. De acordo com o Regime de Competência, a entidade reconheceu a despesa com a bonificação de", "alts": {"A": "R$ 30.000 em novembro de 2025.", "B": "R$ 30.000 em dezembro de 2025.", "C": "R$ 30.000 em janeiro de 2026.", "D": "R$ 2.500 de janeiro a dezembro de 2025.", "E": "R$ 2.727 de janeiro a novembro de 2025."}, "g": "A", "exp": "A bonificação decorre do desempenho e das avaliações de novembro; portanto, a obrigação/despesa pertence a novembro pelo regime de competência. O pagamento em janeiro não desloca a despesa para 2026."}, {"n": 27, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Uma entidade reconhecia as suas receitas e despesas de acordo com o Regime de Competência. Em 2025, a entidade observou que a sua despesa com eletricidade aumentou, mensalmente, em 8%, quando comparada ao mês anterior. Essa despesa foi paga no mês seguinte ao de ocorrência. Em dezembro de 2025, os gestores da entidade decidiram refazer as suas demonstrações contábeis para fins internos, passando a reconhecer as receitas e despesas de acordo com o Regime de Caixa. Pode-se observar que, após a mudança, a despesa com eletricidade em cada mês,", "alts": {"A": "parece ser menor.", "B": "parece ser maior.", "C": "permanece igual.", "D": "apresenta mudanças cíclicas.", "E": "apresenta crescimento irregular."}, "g": "A", "exp": "A eletricidade cresce 8% ao mês e é paga no mês seguinte. Ao usar caixa, cada mês passa a registrar o valor do mês anterior, que é menor que o consumo do mês corrente. Por isso, a despesa mensal aparenta ser menor."}, {"n": 28, "banca": "FGV - AFCE (TCE-SC)/TCE SC/Ciências Contábeis/2026", "q": "Em 01/06/2024, uma entidade pagou, antecipadamente, 18 meses de aluguel. Por conta da antecipação, recebeu um desconto comercial de 10% sobre o valor mensal do aluguel. A entidade elaborou a sua Demonstração do Resultado, em 31/12/2024 e em 31/12/2025, de acordo com o Regime de Caixa. Ao comparar o resultado do período com o que seria obtido se tivesse seguido o Regime de Competência, constatou que os resultados de 31/12/2024 e de 31/12/2025, de acordo com o Regime de Caixa, estavam, respectivamente,", "alts": {"A": "igual e igual.", "B": "subavaliado e subavaliado.", "C": "superavaliado e subavaliado.", "D": "subavaliado e superavaliado.", "E": "superavaliado e superavaliado."}, "g": "D", "exp": "No caixa, todo o pagamento antecipado de 18 meses é despesa em 2024, reduzindo excessivamente o resultado de 2024: subavaliado. Em 2025, não há nova saída relativa a esse aluguel, enquanto a competência reconheceria a parcela correspondente a 2025; assim, o resultado pelo caixa fica superavaliado."}, {"n": 29, "banca": "FGV - ADTND (AMAZUL)/AMAZUL/Auditor/2026", "q": "Estoques são registrados inicialmente pelo custo de aquisição. Entretanto, quando o valor de mercado torna-se inferior ao custo, a Contabilidade exige o reconhecimento da perda para refletir o valor recuperável desse ativo. Considerando esse critério de avaliação, assinale a opção que apresenta o procedimento correto quando o valor de mercado do estoque fica menor que o seu custo.", "alts": {"A": "Manter o estoque registrado pelo custo e reconhecer a perda somente no momento da venda.", "B": "Registrar o estoque pelo valor de mercado sempre que este for superior ao custo.", "C": "Reconhecer provisão para perdas, ajustando o valor do estoque ao montante recuperável.", "D": "Reclassificar o estoque como despesa operacional imediatamente.", "E": "Manter o estoque pelo valor original, pois a perda é reconhecida se for efetivada em caixa."}, "g": "C", "exp": "Quando o valor recuperável/valor de mercado indicado na questão fica abaixo do custo, deve-se reconhecer a perda e ajustar o estoque ao montante recuperável. Não se espera a venda nem o desembolso de caixa; também não se eleva estoque quando o mercado supera o custo."}, {"n": 30, "banca": "FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026", "q": "Uma sociedade empresária apresentava os seguintes saldos em seu Balanço Patrimonial, em 31/12/2024: Disponibilidades: R$50.000; Terreno: R$70.000; Capital Social: R$120.000. Em janeiro de 2025, foi adquirido R$80.000 em estoque para revenda, com pagamento previsto para 120 dias. A alíquota incidente de ICMS era de 12%. Um perito contábil, ao analisar a situação, certificou a correta contabilização pela sociedade empresária do valor do estoque no Balanço Patrimonial, após a compra de", "alts": {"A": "zero.", "B": "R$9.600.", "C": "R$70.400.", "D": "R$80.000.", "E": "R$89.600."}, "g": "C", "exp": "O estoque adquirido por R$80.000 contém ICMS recuperável de 12% = R$9.600. Esse tributo recuperável não integra o custo do estoque. Logo, estoque = 80.000 − 9.600 = R$70.400."}];
let qi=0, side=0, answered=false, selected=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const x=Q[qi], root=document.getElementById('root');
 document.getElementById('count').textContent=(qi+1)+' / '+Q.length;
 if(side===0){
   let a=Object.entries(x.alts).map(([k,v])=>`<button class="alt ${answered?(k===x.g?'correct':(k===selected&&k!==x.g?'wrong':'')):''}" ${answered?'disabled':''} onclick="choose('${k}')"><b>${k})</b> ${esc(v)}</button>`).join('');
   root.innerHTML=`<div class="card"><div class="meta">${esc(x.banca)} • Questão original nº ${x.n}</div><h2>QUESTÃO</h2><div class="qtext">${esc(x.q)}</div>${a}${answered?`<div class="feedback ${selected===x.g?'ok':'no'}">${selected===x.g?'✓ Resposta correta!':'✗ Resposta incorreta. Gabarito: '+x.g}<br>Avance para ver a explicação completa.</div>`:''}<div class="tip">Tecla E: ativa/desativa a escrita. A anotação fica nesta tela e é limpa ao avançar ou voltar.</div></div>`;
 } else {
   let wrong=Object.entries(x.alts).filter(([k])=>k!==x.g).map(([k,v])=>`<p><b>${k}) ERRADA:</b> ${esc(v)}</p>`).join('');
   root.innerHTML=`<div class="card"><div class="meta">${esc(x.banca)} • Questão original nº ${x.n}</div><h2>RESOLUÇÃO COMENTADA</h2><div class="answer">✓ Gabarito: ${x.g}) ${esc(x.alts[x.g])}</div><div class="explain"><b>Explicação:</b><br>${esc(x.exp)}<hr><b>Por que as demais estão erradas?</b>${wrong}</div></div>`;
 }
 window.scrollTo(0,0);
}
function choose(k){if(answered)return; selected=k;answered=true;render()}
function next(){clearInk();if(side===0)side=1;else if(qi<Q.length-1){qi++;side=0;answered=false;selected=null} render()}
function prev(){clearInk();if(side===1)side=0;else if(qi>0){qi--;side=1;answered=true;selected=Q[qi].g} render()}
function restart(){clearInk();qi=0;side=0;answered=false;selected=null;render()}

// Camada de escrita sem barra visível: tecla E liga/desliga; ESC desliga.
const canvas=document.getElementById('ink'), ctx=canvas.getContext('2d');
let drawing=false, last=null;
function resizeInk(){
 const dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr);
 canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#d62828';
}
function clearInk(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
}
function inkOn(){document.body.classList.add('inking')}
function inkOff(){document.body.classList.remove('inking');drawing=false;last=null}
function toggleInk(){document.body.classList.contains('inking')?inkOff():inkOn()}
window.addEventListener('keydown',e=>{
 if((e.key==='e'||e.key==='E')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();toggleInk()}
 if(e.key==='Escape')inkOff(); if((e.key==='l'||e.key==='L')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();clearInk();}
});
canvas.addEventListener('pointerdown',e=>{drawing=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)})
canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();last=[e.clientX,e.clientY]})
canvas.addEventListener('pointerup',()=>{drawing=false;last=null})
canvas.addEventListener('pointercancel',()=>{drawing=false;last=null})
window.addEventListener('resize',()=>{resizeInk()})
resizeInk();render();
</script>
